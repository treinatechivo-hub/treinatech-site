<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Treinatech – Redirecionando...</title>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var mode = params.get('mode');
      var oobCode = params.get('oobCode');
      var base = 'https://www.treinatech.com.br';

      if (mode === 'resetPassword' && oobCode) {
        window.location.replace(
          base + '?mode=resetPassword&oobCode=' + encodeURIComponent(oobCode)
        );
      } else {
        window.location.replace(base);
      }
    })();
  </script>
</head>
<body>
  <p style="font-family:sans-serif;text-align:center;margin-top:4rem;color:#555">
    Redirecionando para a Treinatech…
  </p>
</body>
</html>
